[package]
name = "netdebug"
version = "0.1.0"
edition = "2021"
description = "网络调试助手 — TCP/UDP/WebSocket/Modbus 调试 + Modbus 从站模拟 + 网卡 IP 档案（全 Rust 编写）"
license = "MIT OR Apache-2.0"

[[bin]]
name = "netdebug"
path = "src/main.rs"

[dependencies]
eframe = "0.37"
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
